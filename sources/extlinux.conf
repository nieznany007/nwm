MENU TITLE Flipper One - QEMU ARM64 (adapted boot)
TIMEOUT 100
DEFAULT Desktop
PROMPT 1

LABEL Desktop
  MENU LABEL Desktop
  LINUX /Image
  INITRD /initramfs.cpio.gz
  APPEND console=ttyAMA0 root=/dev/vda3 flipper.profile=Desktop systemd.show_status=1 audit=0 systemd.mask=usb-ncm-msc-mtp-gadget.service systemd.mask=iwd.service systemd.mask=router-ap-5g.service systemd.mask=router-ap-2g.service systemd.mask=router-lan-flipusb0.service

